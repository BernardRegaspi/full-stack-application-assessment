services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: food_search
      MYSQL_USER: food
      MYSQL_PASSWORD: food
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "food", "-pfood"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
